# ============================================================
# CONFIGURATION SPRING BOOT - PROJET CLOUD S5 UNIFIÉ
# ============================================================

# Application
spring.application.name=cloud
server.port=8082

# ============================================================
# BASE DE DONNÉES POSTGRESQL (Docker sur port 5433)
# ============================================================
# spring.datasource.url=jdbc:postgresql://localhost:5433/cloud_db
spring.datasource.url=jdbc:postgresql://localhost:5432/cloud_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# HikariCP connection pool settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-test-query=SELECT 1

# ============================================================
# SÉCURITÉ
# ============================================================
app.security.max-login-attempts=3
app.security.jwt-session-duration-ms=3600000

# Firebase Auth REST (Project settings -> General -> Web API Key)
firebase.api-key=AIzaSyBF6FcOMpyUFMIt3m11c7ZSRBXL-u3KIA4

# Docker compose (désactivé car on lance manuellement)
spring.docker.compose.enabled=false