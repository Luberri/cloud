version: "3.9"

services:

  # Container PostGIS pour les données de carte OSM (utilisé pour générer les tuiles)
  postgis:
    image: postgis/postgis:15-3.4
    container_name: postgis
    environment:
      POSTGRES_DB: gis_osm
      POSTGRES_USER: gisuser
      POSTGRES_PASSWORD: gispass
    volumes:
      - postgis_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  # Serveur de tuiles raster pour Leaflet
  tileserver:
    image: maptiler/tileserver-gl
    container_name: tileserver
    volumes:
      - ./tiles:/data
    ports:
      - "8081:8080"

  frontend:
    build: ./frontend
    ports:
      - "80:80"

volumes:
  postgis_data:


