<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #444;
        }

        .login-container {
            background-color: #ffffff;
            padding: 30px;
            width: 360px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #555;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #666;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background-color: #fafafa;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #999;
            background-color: #fff;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #666;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #444;
        }

        .forgot-password {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        .forgot-password a {
            font-size: 12px;
            color: #777;
            text-decoration: none;
        }

        .forgot-password a:hover {
            text-decoration: underline;
            color: #444;
        }

        .note {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Connexion</h2>

    <form>
        <label for="email">Adresse email</label>
        <input type="email" id="email" placeholder="exemple@email.com">

        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="********">

        <div class="forgot-password">
            <a href="#">Mot de passe oublié ?</a>
        </div>

        <button type="submit">Se connecter</button>
    </form>

    <div class="note">
        Accès sécurisé
    </div>
</div>

</body>
</html>
