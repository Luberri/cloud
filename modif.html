<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier un signalement</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 50px;
            margin: 0;
            color: #444;
        }

        .form-container {
            background-color: #fff;
            padding: 30px;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #555;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #666;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background-color: #fafafa;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #999;
            background-color: #fff;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #666;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #444;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Modifier le signalement</h2>

    <form>
        <label for="title">Titre</label>
        <input type="text" id="title" value="Affaissement de chaussée">

        <label for="description">Description</label>
        <input type="text" id="description" value="Affaissement près d'un arrêt de bus, travaux urgents nécessaires.">

        <label for="surface">Surface (m²)</label>
        <input type="number" id="surface" value="12" step="0.01">

        <label for="budget">Budget (€)</label>
        <input type="number" id="budget" value="40000" step="0.01">

        <label for="status">Statut</label>
        <select id="status">
            <option value="NEW">Nouveau</option>
            <option value="IN_PROGRESS">En cours</option>
            <option value="DONE">Terminé</option>
        </select>

        <button type="submit">Enregistrer les modifications</button>
    </form>
</div>

</body>
</html>
