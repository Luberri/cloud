version: "3.9"

services:

  # Container PostgreSQL/PostGIS pour la base de données unifiée (manager + visiteur)
  postgres:
    image: postgis/postgis:15-3.4
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: cloud_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloud_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Serveur de tuiles raster pour Leaflet
  tileserver:
    image: maptiler/tileserver-gl
    container_name: tileserver
    volumes:
      - ./tiles:/data
    ports:
      - "8081:8080"

  # Backend Spring Boot
  backend:
    image: visiteur-backend:latest
    build: ./backend
    container_name: spring_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloud_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  # Frontend React
  frontend:
    image: visiteur-frontend:latest
    build: ./frontend
    container_name: react_frontend
    restart: always
    depends_on:
      - backend
      - tileserver
    ports:
      - "80:80"

volumes:
  postgres_data:
